version: "3.9"

services:

  # ==============================
  # Shared Laravel Base
  # ==============================
  x-laravel-base: &laravel-base
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /var/www/html/backend
    volumes:
      - ../app:/var/www/html/backend/app
      - ../routes:/var/www/html/backend/routes
      - ../config:/var/www/html/backend/config
      - ../database:/var/www/html/backend/database
      - ../public:/var/www/html/backend/public
      - ../resources:/var/www/html/backend/resources
      - ../storage:/var/www/html/backend/storage
      - ../bootstrap:/var/www/html/backend/bootstrap
      - ../.env:/var/www/html/backend/.env
      - vendor:/var/www/html/backend/vendor
    networks:
      - ticket
    depends_on:
      - mysql

  # ==============================
  # App (PHP-FPM)
  # ==============================
  app:
    <<: *laravel-base
    container_name: ticket-app
    command: php-fpm

  # ==============================
  # Nginx
  # ==============================
  nginx:
    image: nginx:alpine
    container_name: ticket-nginx
    ports:
      - "8080:80"
    volumes:
      - ../public:/var/www/html/backend/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ticket

  # ==============================
  # Queue Worker
  # ==============================
  queue:
    <<: *laravel-base
    container_name: ticket-queue
    command: php artisan queue:work --sleep=3 --tries=3

  # ==============================
  # Scheduler
  # ==============================
  scheduler:
    <<: *laravel-base
    container_name: ticket-scheduler
    command: php artisan schedule:work

  # ==============================
  # MySQL
  # ==============================
  mysql:
    image: mysql:8.0
    container_name: ticket-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: T1ck3tP0rtl2026
      MYSQL_DATABASE: ticket_portal
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: T1ck3tP0rtl2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ticket

  # ==============================
  # phpMyAdmin (optional)
  # ==============================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ticket-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - ticket

# ==============================
# Volumes
# ==============================
volumes:
  db_data:
  vendor:

# ==============================
# Network
# ==============================
networks:
  ticket:
    driver: bridge
